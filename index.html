<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homepage</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Syne:wght@400;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css">
   
  </head>
  <body>
    <div class="grain"></div>
    <div class="wrapper">
      <div class="greeting">
        <div class="time-live" id="live-time">—</div>
        <h1 id="greet-text">Good morning, Maverick.</h1>
      </div>

      <div class="countdown-card">
        <div class="countdown-label">Counting down to</div>
        <div class="countdown-title">9th October 2026 — 00:00:00</div>
        <div class="rings-row">
          <div class="ring-unit">
            <div class="ring-wrap">
              <svg viewBox="0 0 100 100">
                <circle
                  class="ring-bg-c"
                  cx="50"
                  cy="50"
                  r="43"
                  stroke-width="5"
                />
                <circle
                  class="ring-prog"
                  id="ring-days"
                  cx="50"
                  cy="50"
                  r="43"
                  stroke-width="5"
                  stroke-dasharray="270.2"
                  stroke-dashoffset="270.2"
                />
              </svg>
              <div class="ring-number" id="num-days">—</div>
            </div>
            <div class="ring-name">Days</div>
          </div>
          <div class="ring-unit">
            <div class="ring-wrap">
              <svg viewBox="0 0 100 100">
                <circle
                  class="ring-bg-c"
                  cx="50"
                  cy="50"
                  r="43"
                  stroke-width="5"
                />
                <circle
                  class="ring-prog"
                  id="ring-hours"
                  cx="50"
                  cy="50"
                  r="43"
                  stroke-width="5"
                  stroke-dasharray="270.2"
                  stroke-dashoffset="270.2"
                />
              </svg>
              <div class="ring-number" id="num-hours">—</div>
            </div>
            <div class="ring-name">Hours</div>
          </div>
          <div class="ring-unit">
            <div class="ring-wrap">
              <svg viewBox="0 0 100 100">
                <circle
                  class="ring-bg-c"
                  cx="50"
                  cy="50"
                  r="43"
                  stroke-width="5"
                />
                <circle
                  class="ring-prog"
                  id="ring-mins"
                  cx="50"
                  cy="50"
                  r="43"
                  stroke-width="5"
                  stroke-dasharray="270.2"
                  stroke-dashoffset="270.2"
                />
              </svg>
              <div class="ring-number" id="num-mins">—</div>
            </div>
            <div class="ring-name">Minutes</div>
          </div>
          <div class="ring-unit">
            <div class="ring-wrap">
              <svg viewBox="0 0 100 100">
                <circle
                  class="ring-bg-c"
                  cx="50"
                  cy="50"
                  r="43"
                  stroke-width="5"
                />
                <circle
                  class="ring-prog"
                  id="ring-secs"
                  cx="50"
                  cy="50"
                  r="43"
                  stroke-width="5"
                  stroke-dasharray="270.2"
                  stroke-dashoffset="270.2"
                />
              </svg>
              <div class="ring-number" id="num-secs">—</div>
            </div>
            <div class="ring-name">Seconds</div>
          </div>
        </div>
      </div>

      <div class="bookmarks-section" id="bm-section"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
